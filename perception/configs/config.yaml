hopf_grid:
  n_elevation: 64
  n_inplane: 16
  total_anchors: 1024
  expected_mean_gap_deg: 11.75
  expected_max_gap_deg: 21.17

pose_head:
  lambda_fine: 10.0
  translation_loss: smooth_l1
  classification_loss: cross_entropy

jensen_gain:
  n_rotations: 16
  # Thresholds in degrees (geodesic distance from mean)
  # Must match JensenGainMonitor.HIGH_CONFIDENCE_THRESH and MODERATE_THRESH
  high_confidence_thresh_deg: 15.0
  moderate_thresh_deg: 35.0

model:
  # Supported backbones: efficientnet_b3, resnet50 (PoseNet_ResNet50)
  # The checkpoint's model_class field determines which architecture loads.
  backbone: resnet50
  img_size: 224
  neck_dims: [1024, 512]     # resnet50: 2048 -> 1024 -> 512
  quat_head_dim: 4
  trans_head_dim: 3